<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics Evaluation Testing Portal</title>
    <link rel="stylesheet" href="shared_style.css">
</head>
<body>
    <div class="panel" style="max-width:540px; margin:auto; position:relative;">
        <div style="text-align:right;"><button id="theme-switcher-btn" class="btn btn-secondary" style="width:auto; margin:0; padding:6px 12px; font-size:12px;" onclick="toggleUIMode()">☀️ Light Mode</button></div>
        
        <div id="login-screen">
            <h2>Active Portal: Mathematics</h2>
            <p style="color:var(--text-muted); font-size:14px; margin-top:-5px;">Topic Context: Percentages | Target: Grade 4, Grade 5, Grade 6</p>
            <label>User Verification Handle</label>
            <input type="text" id="username" placeholder="Enter student identifier (e.g. Student Name)..." style="margin-top:5px; margin-bottom:15px;">
            <button class="btn" onclick="startExamEngine()">Authenticate Session</button>
        </div>
        
        <div id="exam-screen" class="hidden">
            <div class="meta-row"><span id="progress-text"></span><span id="clock-display" style="font-weight:600; color:var(--primary);">Clock running...</span></div>
            <h3 id="question-text">Reading matrix node data...</h3>
            <div id="options-container"></div>
        </div>
        
        <div id="result-screen" class="hidden">
            <h2>Session Terminated</h2><div id="stats-summary"></div>
            <button class="btn" onclick="downloadExamCSV()">📥 Extract Performance Logs (CSV)</button>
        </div>
    </div>
    <script>
        const examConfig = { 
            timeLimitMinutes: 10, 
            showCorrectOnSubmit: "yes",
            gamification: {"enabled":true,"scoring":{"basePointsPerCorrect":100,"timeBonus":{"enabled":true,"maxBonusPoints":50,"speedBenchmarkSeconds":15},"streakMultiplier":{"enabled":true,"streakThreshold":3,"multiplierIncrement":0.25,"maxMultiplier":2.5}},"lifelines":{"fiftyFiftyCount":1,"aiHintCount":2,"freezeTimerCount":1,"freezeDurationSeconds":30},"ranks":[{"name":"Novice","minScore":0,"badge":"🌱"},{"name":"Scholar","minScore":1200,"badge":"⚡"},{"name":"Master","minScore":2800,"badge":"🔥"},{"name":"Grandmaster","minScore":4500,"badge":"👑"}],"soundEffects":{"enabled":true,"volume":0.6}}
        };
        const examQuestions = [{"q":"What is 50 percent of 20?","options":["5","10","15","25"],"correct":1,"difficulty":"very low","hint":"Think of 50 percent as one-half of a whole number.","explanation":"50 percent is equivalent to the fraction 1/2, and half of 20 is 10."},{"q":"If a basket has 10 apples and 20 percent of them are green, how many apples are green?","options":["2","4","8","20"],"correct":0,"difficulty":"very low","hint":"20 percent is the same as 20 out of 100, or 2 out of 10.","explanation":"To find 20 percent of 10, you multiply 10 by 0.20, which equals 2."},{"q":"Which fraction is equal to 25 percent?","options":["1/2","1/3","1/4","1/5"],"correct":2,"difficulty":"very low","hint":"How many times does 25 go into 100?","explanation":"25 percent means 25 out of 100, which simplifies to the fraction 1/4."}];
    </script>
    <script src="exam_engine.js"></script>
</body>
</html>
