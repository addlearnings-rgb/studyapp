<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics Evaluation Testing Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="panel" style="max-width:540px; margin:auto; position:relative;">
        <div style="text-align:right;"><button id="theme-switcher-btn" class="btn btn-secondary" style="width:auto; margin:0; padding:6px 12px; font-size:12px;" onclick="toggleUIMode()">☀️ Light Mode</button></div>
        <div id="login-screen">
            <h2>Active Portal: Mathematics</h2>
            <p style="color:var(--text-muted); font-size:14px; margin-top:-5px;">Topic Context: Percentage | Target: Grade 4, Grade 5</p>
            <label>User Verification Handle</label>
            <input type="text" id="username" placeholder="Enter student identifier..." style="margin-top:5px; margin-bottom:15px;">
            <button class="btn" onclick="startExamEngine()">Authenticate Session</button>
        </div>
        <div id="exam-screen" class="hidden">
            <div class="meta-row"><span id="progress-text"></span><span id="clock-display" style="font-weight:600; color:var(--primary);">Clock running...</span></div>
            <h3 id="question-text">Reading matrix node data...</h3>
            <div id="options-container"></div>
        </div>
        <div id="result-screen" class="hidden">
            <h2>Session Terminated</h2><div id="stats-summary"></div>
            <button class="btn" onclick="downloadExamCSV()">📥 Extract Performance Logs (CSV)</button>
        </div>
    </div>
    <script>
        const examConfig = { 
            timeLimitMinutes: 120, 
            showCorrectOnSubmit: "yes",
            gamification: {"enabled":true,"scoring":{"basePointsPerCorrect":100,"timeBonus":{"enabled":true,"maxBonusPoints":50,"speedBenchmarkSeconds":15},"streakMultiplier":{"enabled":true,"streakThreshold":3,"multiplierIncrement":0.25,"maxMultiplier":2.5}},"lifelines":{"fiftyFiftyCount":1,"aiHintCount":2,"freezeTimerCount":1,"freezeDurationSeconds":30},"ranks":[{"name":"Novice","minScore":0,"badge":"🌱"},{"name":"Scholar","minScore":1200,"badge":"⚡"},{"name":"Master","minScore":2800,"badge":"🔥"},{"name":"Grandmaster","minScore":4500,"badge":"👑"}],"soundEffects":{"enabled":true,"volume":0.6}}
        };
        const examQuestions = [{"q":"A bag contains 5 red marbles and 5 blue marbles. What is the percentage of red marbles in the bag, expressed as a ratio of 5 out of 10?","options":["10 percent","25 percent","50 percent","75 percent"],"correct":2,"difficulty":"very low","hint":"Think about how many red marbles there are compared to the total number of marbles.","explanation":"Since 5 out of 10 marbles are red, this represents half of the total, which is equal to 50 percent."},{"q":"A fruit basket has 4 apples and 1 orange. What is the percentage of oranges in the basket, given the ratio of 1 orange to 5 total pieces of fruit?","options":["10 percent","20 percent","25 percent","40 percent"],"correct":1,"difficulty":"very low","hint":"To find the percentage, convert the ratio 1/5 so that the bottom number is 100.","explanation":"The ratio 1/5 is equal to 20/100, which represents 20 percent of the total fruit."}];
    </script>
    <script src="app.js"></script>
</body>
</html>
